name: android-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee build-test.log
      - name: Surface test log on failure
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build-test.log > build-test.clean.log
          grep -a -E "FAILED|Caused by|What went wrong|error:|e: " build-test.clean.log | head -30 | cut -c1-600 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Lint
        run: |
          set -o pipefail
          gradle lintDebug --stacktrace 2>&1 | tee build-lint.log
      - name: Surface lint log on failure
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build-lint.log > build-lint.clean.log
          grep -a -E "Error|FAILED|Caused by|What went wrong" build-lint.clean.log | head -30 | cut -c1-600 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-assemble.log
      - name: Assemble release APK (unsigned)
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build-assemble-release.log
      - uses: actions/upload-artifact@v4
        with:
          name: solardz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solardz-release-apk
          path: app/build/outputs/apk/release/*.apk
