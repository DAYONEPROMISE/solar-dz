name: android-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee build-test.log
      - name: Surface test log on failure
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build-test.log > build-test.clean.log
          grep -a -E "FAILED|Caused by|What went wrong|error:|e: " build-test.clean.log | head -30 | cut -c1-600 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Lint
        run: |
          set -o pipefail
          gradle lintDebug --stacktrace 2>&1 | tee build-lint.log
      - name: Surface lint log on failure
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build-lint.log > build-lint.clean.log
          grep -a -E "Error|FAILED|Caused by|What went wrong" build-lint.clean.log | head -30 | cut -c1-600 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-assemble.log
      - name: Assemble release APK (unsigned)
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build-assemble-release.log
      - uses: actions/upload-artifact@v4
        with:
          name: solardz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: solardz-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Read app version
        run: |
          VER=$(grep -hoP 'versionName\s*=?\s*[\x27\x22]\K[0-9.]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          CODE=$(grep -hoP 'versionCode\s*=?\s*\K[0-9]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          echo "APP_VERSION=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "APP_CODE=${CODE:-0}" >> "$GITHUB_ENV"
      - name: Write release notes
        run: |
          {
            echo "# SolarDZ v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})"; echo ""
            echo "- Version: ${APP_VERSION}+${APP_CODE}"; echo "- Commit: ${GITHUB_SHA}"
            echo "- DZ 2026 OpenPencil pass (design verified, code already conformant)."
            echo "- Debug APK is installable; release APK is unsigned (test only)."; echo ""
            echo "## Files"; find app/build/outputs/apk -name '*.apk' -printf '- %f (%s bytes)\n'
          } > release-notes.md
          cat release-notes.md
      - name: Publish APKs to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: SolarDZ v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          bodyFile: release-notes.md
          artifacts: "app/build/outputs/apk/debug/*.apk,app/build/outputs/apk/release/*.apk"
